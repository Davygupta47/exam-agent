services:
  db:
    image: postgres:16-alpine
    container_name: exam_db
    environment:
      POSTGRES_DB: exam_management
      POSTGRES_USER: exam_admin
      POSTGRES_PASSWORD: exam_pass_123
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d/source
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U exam_admin -d exam_management"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: exam_backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=development
      - PGHOST=db
      - PGPORT=5432
      - PGUSER=exam_admin
      - PGPASSWORD=exam_pass_123
      - PGDATABASE=exam_management
      - JWT_SECRET=8e5c756d35241efa643e7b883f263290b63aea6726f4d779b45a963354ef79eb
      - JWT_EXPIRES_IN=7d
      - CLIENT_URL=http://localhost:3000
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: exam_frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:5000
    depends_on:
      - backend

volumes:
  pgdata:
